<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisum - 复制任务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sunset: linear-gradient(135deg, #ff5c33 0%, #ffa354 46%, #57adff 100%);
            --bg: #f4f4f6;
            --ink: #1d1d1f;
            --sub: #86868b;
            --forest: linear-gradient(135deg, #2d6a4f, #163a29);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--sunset);
            color: var(--ink);
        }

        .app { height: 100%; display: flex; flex-direction: column; }

        .titlebar {
            height: 46px; flex-shrink: 0;
            display: flex; align-items: center; gap: 14px; padding: 0 16px;
            background: rgba(255,255,255,.14);
            border-bottom: 1px solid rgba(255,255,255,.22);
        }
        .traffic { display: flex; gap: 8px; }
        .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .tl-r { background: #ff5f57; } .tl-y { background: #febc2e; } .tl-g { background: #28c840; }
        .scene-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 12px; border-radius: 7px;
            background: rgba(255,255,255,.18);
            color: #fff; font-size: 12px; font-weight: 500; border: none; cursor: pointer;
        }
        .scene-pill svg { width: 14px; height: 14px; fill: #fff; }
        .tb-actions { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(255,255,255,.16);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .icon-btn svg { width: 16px; height: 16px; fill: #fff; }

        .player { height: 282px; flex-shrink: 0; display: flex; align-items: center; }
        .player-left {
            flex: 1; padding: 18px 36px;
            display: flex; flex-direction: column; justify-content: center; min-width: 0;
        }
        .song-title { color: #fff; font-size: 24px; font-weight: 700; }
        .song-artist { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.85); }
        .progress { margin-top: 14px; }
        .pbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); overflow: hidden; }
        .pbar > i { display: block; height: 100%; width: 35%; background: #fff; border-radius: 2px; }
        .ptime {
            display: flex; justify-content: space-between; margin-top: 6px;
            font-size: 11.5px; color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums;
        }
        .controls { display: flex; align-items: center; gap: 22px; margin-top: 12px; }
        .cbtn { border: none; background: none; cursor: pointer; display: flex; color: rgba(255,255,255,.92); padding: 4px; }
        .cbtn svg { fill: currentColor; }
        .cbtn.play {
            width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #ff5c33;
            justify-content: center; align-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.2);
        }
        .cbtn.play svg { fill: #ff5c33; width: 23px; height: 23px; }
        .player-right { padding: 0 28px 0 0; display: flex; align-items: center; }
        .album-sm {
            width: 224px; height: 224px; border-radius: 10px; position: relative; overflow: hidden;
            box-shadow: 0 16px 36px rgba(0,0,0,.26);
        }

        .tabs-zone { flex: 1; background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
        .segmented {
            align-self: center; margin: 12px 0 4px; display: flex;
            background: rgba(0,0,0,.07); border-radius: 8px; padding: 2px;
        }
        .seg {
            border: none; background: none; padding: 5px 20px; font-size: 12.5px;
            font-weight: 500; color: rgba(0,0,0,.6); border-radius: 6px;
        }
        .seg.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.16); font-weight: 600; }
        .tabs-body { flex: 1; }

        .status-strip { height: 42px; flex-shrink: 0; position: relative; }

        /* Dim overlay */
        .dim {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(18,22,34,.42);
            backdrop-filter: blur(1.5px);
        }

        /* Drop tip */
        .drop-tip {
            position: absolute; z-index: 21; top: 66px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 10px;
            padding: 10px 20px; border-radius: 12px;
            background: rgba(255,255,255,.92); color: var(--ink);
            font-size: 13px; font-weight: 600;
            box-shadow: 0 12px 30px rgba(0,0,0,.22);
            border: 2px dashed rgba(255,92,51,.55);
        }
        .drop-tip svg { width: 19px; height: 19px; fill: #ff5c33; }

        /* Status pill */
        .copy-pill {
            position: absolute; z-index: 21; right: 18px; bottom: 8px;
            display: flex; align-items: center; gap: 9px;
            color: #fff; font-size: 12.5px;
            padding: 8px 15px; border-radius: 9px; background: var(--forest);
            box-shadow: 0 8px 20px rgba(0,0,0,.28);
        }
        .copy-pill svg { fill: #fff; }

        /* Popover */
        .popover {
            position: absolute; z-index: 22;
            right: 18px; bottom: 62px;
            width: 450px;
            background: #fff; border-radius: 12px;
            box-shadow: 0 24px 60px rgba(0,0,0,.35);
            overflow: visible;
        }
        .popover::after {
            content: ''; position: absolute; right: 40px; bottom: -7px;
            width: 14px; height: 14px; background: #fff;
            transform: rotate(45deg); border-radius: 2px;
        }
        .pop-h {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px 10px;
            font-size: 13px; font-weight: 700;
        }
        .pop-close {
            border: none; background: #f1f1f4; width: 22px; height: 22px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .pop-close svg { width: 12px; height: 12px; fill: #6b7180; }

        .task { padding: 9px 16px; position: relative; }
        .task + .task::before {
            content: ''; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: #f0f0f2;
        }
        .task-row { display: flex; align-items: center; gap: 10px; }
        .task-name { flex: 1; font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; }
        .task-msg { font-size: 11px; color: var(--sub); white-space: nowrap; }
        .task-msg.done { color: #24a148; font-weight: 600; }
        .task-check svg { width: 16px; height: 16px; fill: #24a148; }
        .task-bar { margin-top: 7px; height: 4px; border-radius: 2px; background: #ececf0; overflow: hidden; }
        .task-bar i { display: block; height: 100%; border-radius: 2px; background: #0a84ff; }
        .task-bar i.done { background: #24a148; }
        .task-bar i.wait { background: #d2d2d8; width: 100% !important; opacity: .5; }
    </style>
</head>
<body>
    <div class="app">
        <div class="titlebar">
            <div class="traffic"><i class="tl-r"></i><i class="tl-y"></i><i class="tl-g"></i></div>
            <button class="scene-pill">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
                音乐仓库
            </button>
            <div class="tb-actions">
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                </button>
            </div>
        </div>

        <div class="player">
            <div class="player-left">
                <div class="song-title">晴天</div>
                <div class="song-artist">周杰伦 · 叶惠美</div>
                <div class="progress">
                    <div class="pbar"><i></i></div>
                    <div class="ptime"><span>1:24</span><span>3:45</span></div>
                </div>
                <div class="controls">
                    <button class="cbtn"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
                    <button class="cbtn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="cbtn play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button class="cbtn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
                    <button class="cbtn"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
                </div>
            </div>
            <div class="player-right">
                <div class="album-sm">
                    <svg viewBox="0 0 224 224" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
                        <defs>
                            <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#3f93e6"/>
                                <stop offset=".55" stop-color="#8fc6fb"/>
                                <stop offset="1" stop-color="#ffe29a"/>
                            </linearGradient>
                        </defs>
                        <rect width="224" height="224" fill="url(#sky4)"/>
                        <circle cx="154" cy="64" r="36" fill="#fff6cf" opacity=".95"/>
                        <g fill="#ffffff" opacity=".9">
                            <ellipse cx="56" cy="138" rx="38" ry="15"/>
                            <ellipse cx="84" cy="126" rx="30" ry="12"/>
                        </g>
                        <ellipse cx="112" cy="205" rx="130" ry="42" fill="#7fb539" opacity=".55"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="tabs-zone">
            <div class="segmented">
                <button class="seg active">音乐仓库</button>
                <button class="seg">设置</button>
            </div>
            <div class="tabs-body"></div>
        </div>

        <div class="status-strip"></div>

        <!-- Overlay layer -->
        <div class="dim"></div>

        <div class="drop-tip">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            松开鼠标，文件将复制到音乐仓库
        </div>

        <div class="copy-pill">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>正在复制 4 个文件</span>
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-4-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </div>

        <div class="popover">
            <div class="pop-h">
                <span>正在复制 4 个文件</span>
                <button class="pop-close" data-prototype-link="03-music-library" data-prototype-label="关闭">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <div class="task">
                <div class="task-row">
                    <div class="task-name">晴天.mp3</div>
                    <div class="task-msg">正在复制 · 68%</div>
                </div>
                <div class="task-bar"><i style="width:68%"></i></div>
            </div>

            <div class="task">
                <div class="task-row">
                    <div class="task-name">稻香.flac</div>
                    <div class="task-msg">正在复制 · 34%</div>
                </div>
                <div class="task-bar"><i style="width:34%"></i></div>
            </div>

            <div class="task">
                <div class="task-row">
                    <div class="task-name">七里香.mp3</div>
                    <div class="task-msg">等待中</div>
                </div>
                <div class="task-bar"><i class="wait"></i></div>
            </div>

            <div class="task">
                <div class="task-row">
                    <div class="task-name">夜曲.mp3</div>
                    <div class="task-msg done">已完成</div>
                    <div class="task-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                </div>
                <div class="task-bar"><i class="done" style="width:100%"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
