<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisum - 场景切换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sunset: linear-gradient(135deg, #ff5c33 0%, #ffa354 46%, #57adff 100%);
            --bg: #f4f4f6;
            --ink: #1d1d1f;
            --sub: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--sunset);
            color: var(--ink);
        }

        .app { height: 100%; display: flex; flex-direction: column; }

        .titlebar {
            height: 46px; flex-shrink: 0;
            display: flex; align-items: center; gap: 14px; padding: 0 16px;
            background: rgba(255,255,255,.14);
            border-bottom: 1px solid rgba(255,255,255,.22);
        }
        .traffic { display: flex; gap: 8px; }
        .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .tl-r { background: #ff5f57; } .tl-y { background: #febc2e; } .tl-g { background: #28c840; }
        .scene-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 12px; border-radius: 7px;
            background: rgba(255,255,255,.3);
            color: #fff; font-size: 12px; font-weight: 500; border: none;
        }
        .scene-pill svg { width: 14px; height: 14px; fill: #fff; }
        .tb-actions { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(255,255,255,.16);
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn svg { width: 16px; height: 16px; fill: #fff; }

        .player { height: 282px; flex-shrink: 0; }
        .tabs-zone { flex: 1; background: var(--bg); }
        .status-strip { height: 42px; flex-shrink: 0; }

        /* Dim */
        .dim {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(18,22,34,.38);
        }

        /* Popover */
        .popover {
            position: absolute; z-index: 21;
            top: 54px; left: 14px;
            width: 560px;
            background: #fff; border-radius: 12px;
            box-shadow: 0 24px 60px rgba(0,0,0,.38);
            padding: 16px;
        }
        .popover::before {
            content: ''; position: absolute; top: -7px; left: 26px;
            width: 14px; height: 14px; background: #fff;
            transform: rotate(45deg); border-radius: 2px;
        }

        .pop-close {
            position: absolute; top: 12px; right: 12px;
            border: none; background: #f1f1f4; width: 22px; height: 22px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .pop-close svg { width: 12px; height: 12px; fill: #6b7180; }

        .segmented {
            display: flex; background: rgba(0,0,0,.07); border-radius: 8px; padding: 2px;
        }
        .seg {
            flex: 1; border: none; background: none; padding: 6px; font-size: 12.5px;
            font-weight: 500; color: rgba(0,0,0,.6); border-radius: 6px; cursor: pointer;
        }
        .seg.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.16); font-weight: 600; }

        .pop-desc { margin: 12px 2px 10px; font-size: 12px; color: var(--sub); }

        .groupbox {
            border: 1px solid #e5e5e7; border-radius: 9px; background: #fafafc;
            padding: 10px 12px;
        }
        .mini-row {
            display: flex; align-items: center; gap: 10px; height: 34px;
            border-radius: 6px; padding: 0 8px;
        }
        .mini-row.playing { background: rgba(255,92,51,.1); }
        .mini-av {
            width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .mini-av svg { width: 11px; height: 11px; fill: rgba(255,255,255,.95); }
        .ma1 { background: linear-gradient(135deg,#ff6a3d,#ffa354); }
        .ma2 { background: linear-gradient(135deg,#5b8def,#8ab6ff); }
        .ma3 { background: linear-gradient(135deg,#b06ab3,#d58dc9); }
        .ma4 { background: linear-gradient(135deg,#2d6a4f,#52b788); }
        .ma5 { background: linear-gradient(135deg,#c2703d,#e8a87c); }
        .ma6 { background: linear-gradient(135deg,#4a5568,#718096); }
        .ma-now { background: linear-gradient(160deg,#3f93e6,#8fc6fb 60%,#ffe29a); }
        .mini-name { flex: 1; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; }
        .mini-row.playing .mini-name { color: #e8501f; }
        .mini-size { font-size: 10.5px; color: var(--sub); }
    </style>
</head>
<body>
    <div class="app">
        <div class="titlebar">
            <div class="traffic"><i class="tl-r"></i><i class="tl-y"></i><i class="tl-g"></i></div>
            <button class="scene-pill">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
                音乐仓库
            </button>
            <div class="tb-actions">
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                </button>
            </div>
        </div>

        <div class="player"></div>
        <div class="tabs-zone"></div>
        <div class="status-strip"></div>

        <div class="dim"></div>

        <div class="popover">
            <div class="segmented">
                <button class="seg active" data-prototype-link="03-music-library" data-prototype-label="音乐仓库">音乐仓库</button>
                <button class="seg" data-prototype-link="04-audiobooks" data-prototype-label="有声书">有声书</button>
            </div>

            <div class="pop-desc">简单纯粹的音乐播放器</div>

            <div class="groupbox">
                <div class="mini-row playing">
                    <div class="mini-av ma-now"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                    <div class="mini-name">晴天.mp3</div>
                    <div class="mini-size">8.4 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma1"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">稻香.mp3</div>
                    <div class="mini-size">9.1 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma2"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">七里香.mp3</div>
                    <div class="mini-size">8.7 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma6"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">夜曲.mp3</div>
                    <div class="mini-size">9.6 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma4"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">青花瓷.mp3</div>
                    <div class="mini-size">8.2 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma3"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">红豆.mp3</div>
                    <div class="mini-size">7.9 MB</div>
                </div>
                <div class="mini-row">
                    <div class="mini-av ma5"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
                    <div class="mini-name">匆匆那年.mp3</div>
                    <div class="mini-size">8.8 MB</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
