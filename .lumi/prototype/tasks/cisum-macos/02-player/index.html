<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisum - 正在播放</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sunset: linear-gradient(135deg, #ff5c33 0%, #ffa354 46%, #57adff 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--sunset);
            color: #ffffff;
        }

        .app { height: 100%; display: flex; flex-direction: column; }

        /* Title bar */
        .titlebar {
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: rgba(255,255,255,.14);
            border-bottom: 1px solid rgba(255,255,255,.22);
        }

        .traffic { display: flex; gap: 8px; }
        .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .tl-r { background: #ff5f57; } .tl-y { background: #febc2e; } .tl-g { background: #28c840; }

        .scene-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 12px; border-radius: 7px;
            background: rgba(255,255,255,.18);
            color: #fff; font-size: 12px; font-weight: 500;
            border: none; cursor: pointer;
        }
        .scene-pill svg { width: 14px; height: 14px; fill: #fff; }

        .tb-actions { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: rgba(255,255,255,.16);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .icon-btn svg { width: 16px; height: 16px; fill: #fff; }

        /* Player */
        .player { flex: 1; display: flex; align-items: center; }

        .player-left {
            flex: 1;
            padding: 0 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .song-title { font-size: 40px; font-weight: 700; letter-spacing: .3px; }
        .song-artist { margin-top: 8px; font-size: 16px; color: rgba(255,255,255,.85); }

        .progress { margin-top: 34px; max-width: 520px; }
        .pbar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
        .pbar > i { display: block; height: 100%; width: 35%; background: #fff; border-radius: 3px; }
        .ptime {
            display: flex; justify-content: space-between; margin-top: 9px;
            font-size: 12.5px; color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums;
        }

        .controls { display: flex; align-items: center; gap: 34px; margin-top: 30px; }
        .cbtn {
            border: none; background: none; cursor: pointer;
            display: flex; color: rgba(255,255,255,.92); padding: 6px;
        }
        .cbtn svg { fill: currentColor; }
        .cbtn.more { color: rgba(255,255,255,.85); }
        .cbtn.play {
            width: 66px; height: 66px; border-radius: 50%;
            background: #fff; color: #ff5c33;
            justify-content: center; align-items: center;
            box-shadow: 0 10px 26px rgba(0,0,0,.22);
        }
        .cbtn.play svg { fill: #ff5c33; width: 30px; height: 30px; }

        .player-right { padding: 0 64px 0 0; display: flex; align-items: center; }
        .album {
            width: 380px; height: 380px; border-radius: 14px;
            position: relative; overflow: hidden;
            box-shadow: 0 26px 60px rgba(0,0,0,.3);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="titlebar">
            <div class="traffic"><i class="tl-r"></i><i class="tl-y"></i><i class="tl-g"></i></div>
            <button class="scene-pill" data-prototype-link="07-scene-switcher" data-prototype-label="切换场景">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
                音乐仓库
            </button>
            <div class="tb-actions">
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                </button>
            </div>
        </div>

        <div class="player">
            <div class="player-left">
                <div class="song-title">晴天</div>
                <div class="song-artist">周杰伦 · 叶惠美</div>

                <div class="progress">
                    <div class="pbar"><i></i></div>
                    <div class="ptime"><span>1:24</span><span>3:45</span></div>
                </div>

                <div class="controls">
                    <button class="cbtn more" data-prototype-link="03-music-library" data-prototype-label="打开音乐仓库">
                        <svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    </button>
                    <button class="cbtn">
                        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="cbtn play">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="cbtn">
                        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                    </button>
                    <button class="cbtn">
                        <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    </button>
                </div>
            </div>

            <div class="player-right">
                <div class="album">
                    <svg viewBox="0 0 380 380" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
                        <defs>
                            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#3f93e6"/>
                                <stop offset=".55" stop-color="#8fc6fb"/>
                                <stop offset="1" stop-color="#ffe29a"/>
                            </linearGradient>
                        </defs>
                        <rect width="380" height="380" fill="url(#sky)"/>
                        <circle cx="262" cy="108" r="62" fill="#fff6cf" opacity=".95"/>
                        <g fill="#ffffff" opacity=".9">
                            <ellipse cx="92" cy="232" rx="66" ry="26"/>
                            <ellipse cx="140" cy="212" rx="52" ry="20"/>
                        </g>
                        <ellipse cx="190" cy="350" rx="220" ry="70" fill="#7fb539" opacity=".55"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
