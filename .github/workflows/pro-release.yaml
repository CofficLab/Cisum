name: Pro Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  tag: ${{ github.event.head_commit.id }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: version
        run: |
          source .github/scripts/xcode-project.sh

          # 查找 Xcode 项目文件（project.xcproj 或 project.pbxproj）
          projectFile=$(xcode_project_file "$(pwd)")
          echo "📁 Project file: $projectFile"

          # 读取文件中的版本号
          version=$(xcode_project_setting "$projectFile" MARKETING_VERSION \
            | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')

          if [ -z "$version" ]; then
            echo "Error: 无法从项目文件读取版本号" >&2
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "📦 Current Version: $version"
          echo "🏷️  Releasing as: v$version"
          echo "tag=v$version" >> $GITHUB_ENV

      - name: 显示变更摘要
        run: |
          echo "### 🎯 正式版本发布" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **发布版本**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **来源**: Xcode 配置文件中的版本号" >> $GITHUB_STEP_SUMMARY

      - name: Generate Changelog
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          ./.github/scripts/generate-changelog.sh "${{ github.workspace }}-CHANGELOG.txt"

      - name: Display Changelog
        run: cat "${{ github.workspace }}-CHANGELOG.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.tag }}
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ./**/*.dmg
            ./**/*.zip
            ./**/*.exe
            ./**/*.pkg
            ./**/*.deb
            ./**/*.ipa
            ./**/*.AppImage
            ./**/*.snap
          draft: false
          prerelease: false
