name: Pre Bump

on:
  push:
    branches:
      - pre

permissions:
  contents: write

env:
  tag: ${{ github.event.head_commit.id }}

jobs:
  bump:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      increment: ${{ steps.version.outputs.increment }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 计算新版本号
        id: version
        run: |
          chmod +x .github/scripts/bump-version.sh
          chmod +x .github/scripts/calculate-version.sh
          chmod +x .github/scripts/xcode-project.sh

          # 计算版本增量类型（major/minor/patch）
          INCREMENT=$(./.github/scripts/bump-version.sh)

          # 计算并更新新版本号
          VERSION=$(./.github/scripts/calculate-version.sh)

          # 添加 p 前缀
          TAG_VERSION="p${VERSION}"

          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "semver=$VERSION" >> $GITHUB_OUTPUT
          echo "increment=$INCREMENT" >> $GITHUB_OUTPUT
          echo "📦 Version Increment: $INCREMENT"
          echo "🏷️  New Version: $VERSION"
          echo "🔖 Tag Version: $TAG_VERSION"

      - name: 显示变更摘要
        run: |
          echo "### 🎯 版本更新信息 (Pre-release)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **增量类型**: ${{ steps.version.outputs.increment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **版本号**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 自上次标签以来的提交:" >> $GITHUB_STEP_SUMMARY
          git log $(git describe --tags --abbrev=0 --match 'p*' 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "p0.0.0")..HEAD --pretty=format:'- %s' | head -20 >> $GITHUB_STEP_SUMMARY

      - name: 验证版本更新
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          source .github/scripts/xcode-project.sh

          projectFile=$(xcode_project_file "$(pwd)")
          echo "📁 Project file: $projectFile"

          updatedVersion=$(xcode_project_setting "$projectFile" MARKETING_VERSION)
          echo "✅ 验证版本号: $updatedVersion"

          if [ "$updatedVersion" != "$EXPECTED_VERSION" ]; then
            echo "Error: 项目版本号未更新到 $EXPECTED_VERSION" >&2
            exit 1
          fi

          git status

      # agvtool (and actions built on it) only understands project.pbxproj and
      # fails on the JSON project.xcproj, so the build number is bumped here.
      - name: 更新构建号
        run: |
          chmod +x .github/scripts/bump-build-number.sh
          ./.github/scripts/bump-build-number.sh

      - name: 生成标签
        env:
          BETA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source .github/scripts/xcode-project.sh

          projectFile=$(xcode_project_file "$(pwd)")
          BUILD=$(xcode_project_setting "$projectFile" CURRENT_PROJECT_VERSION)

          echo "🏷️  Tag: $BETA_VERSION"
          echo "🔢 Build: $BUILD"
          echo "build=$BUILD" >> $GITHUB_ENV

      - name: 打标签并推送到仓库
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "ci: bump a new beta version"
          commit_user_name: GitHub Action

      - name: 创建并推送标签
        env:
          BETA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 获取最新提交（auto-commit 已推送到 pre）
          git fetch origin pre
          git checkout pre
          git pull --ff-only origin pre

          # 创建标签（p 前缀）
          TAG="$BETA_VERSION"
          echo "🏷️  Creating tag: $TAG"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skipping creation" >&2
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          # 推送标签
          git push origin "refs/tags/$TAG"

          echo "✅ Tag pushed: $TAG"

  rebase:
    needs:
      - bump
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 dev 分支
        uses: actions/checkout@v3
        with:
          ref: dev
      - name: 拉取 pre 分支
        run: git fetch origin pre
      - name: Rebase dev on pre
        continue-on-error: true
        run: git rebase origin/pre
      - name: Push the rebased dev branch
        continue-on-error: true
        run: git push origin dev
